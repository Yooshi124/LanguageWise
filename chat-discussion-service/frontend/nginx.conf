# nginx configuration for the chat-discussion-service frontend container.
#
# Serves the static build output and reverse-proxies every /api/ call to this
# service's own backend over the Docker network, so the browser talks to a
# single origin and no CORS configuration is needed.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the upstream per request through a
    # variable means nginx still starts when the backend is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        access_log   off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"chat-discussion-service-frontend"}';
    }

    location /chat-discussion/ {
        rewrite ^/chat-discussion/(.*)$ /$1 last;
    }

    # AI mode's answer stream. An exact match, so it wins over both /api/ and the
    # /api/assistant/ prefix below regardless of the order they appear in.
    #
    # Buffering is what would otherwise break streaming: nginx would hold the
    # server-sent events back and hand the browser the whole answer at once,
    # which is the one thing this endpoint exists to avoid.
    location = /api/assistant/messages {
        set $lw_assistant_stream "http://chat-discussion-service-backend:8080";
        proxy_pass $lw_assistant_stream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # The rest of AI mode, ahead of /api/ because nginx prefers the longest
    # matching prefix. These are ordinary short reads.
    location /api/assistant/ {
        set $lw_assistant "http://chat-discussion-service-backend:8080";
        proxy_pass $lw_assistant$request_uri;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location /api/ {
        set $lw_backend "http://chat-discussion-service-backend:8080";
        proxy_pass $lw_backend$request_uri;

        # Image uploads. nginx allows 1 MB by default, which would 413 a file the
        # backend is willing to accept. Kept just above ImageRules.MaxBytes so the
        # size limit is reported by the backend as a validation message.
        client_max_body_size 6m;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location /shared-api/ {
        set $lw_shared "http://shared-backend:8080";
        rewrite ^/shared-api/(.*)$ /api/$1 break;
        proxy_pass $lw_shared;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
