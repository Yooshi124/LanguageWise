  # ------------ leaderboard-analytics-service — Leaderboard & Analytics (Roan) --

  leaderboard-analytics-service-db:
    container_name: leaderboard-analytics-service-db
    build:
      context: ./leaderboard-analytics-service/database
    environment:
      Database__Path: /data/leaderboard-analytics-service.db
    volumes:
      - leaderboard-analytics-service-db-data:/data
    ports:
      - "6005:8080"
    networks: [languagewise]
    restart: unless-stopped

  leaderboard-analytics-service-backend:
    container_name: leaderboard-analytics-service-backend
    build:
      context: ./leaderboard-analytics-service/backend
    environment:
      Services__Database: http://leaderboard-analytics-service-db:8080
    ports:
      - "5005:8080"
    networks: [languagewise]
    depends_on:
      leaderboard-analytics-service-db:
        condition: service_healthy
    restart: unless-stopped

  leaderboard-analytics-service-frontend:
    container_name: leaderboard-analytics-service-frontend
    build:
      context: ./leaderboard-analytics-service/frontend
    ports:
