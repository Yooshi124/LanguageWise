name: languagewise

networks:
  languagewise:
    driver: bridge

volumes:
  shared-db-data:
  quizzes-courses-service-db-data:

secrets:
  signing_key:
    file: ./signing_key.pem

services:
  shared-db:
    container_name: shared-db
    build:
      context: ./shared/database
    environment:
      Database__Path: /data/shared.db
    volumes:
      - shared-db-data:/data
    ports:
      - "127.0.0.1:6000:8080"
    networks: [languagewise]
    restart: unless-stopped

  shared-backend:
    container_name: shared-backend
    build:
      context: ./shared/backend
    environment:
      Services__Database: http://shared-db:8080
      Auth__SigningKeyPath: /run/secrets/signing_key
    secrets:
      - signing_key
    ports:
      - "127.0.0.1:5000:8080"
    networks: [languagewise]
    depends_on:
      shared-db:
        condition: service_healthy
    restart: unless-stopped

  shared-frontend:
    container_name: shared-frontend
    build:
      context: ./shared/frontend
    ports:
      - "127.0.0.1:3000:80"
    networks: [languagewise]
    depends_on:
      shared-backend:
        condition: service_healthy
    restart: unless-stopped

  quizzes-courses-service-db:
    container_name: quizzes-courses-service-db
    build:
      context: ./quizzes-courses-service/database
    environment:
      Database__Path: /data/quizzes-courses-service.db
    volumes:
      - quizzes-courses-service-db-data:/data
    ports:
      - "127.0.0.1:6003:8080"
    networks: [languagewise]
    restart: unless-stopped

  quizzes-courses-service-backend:
    container_name: quizzes-courses-service-backend
    build:
      context: ./quizzes-courses-service/backend
    environment:
      Services__Database: http://quizzes-courses-service-db:8080
    ports:
      - "127.0.0.1:5003:8080"
    networks: [languagewise]
    depends_on:
      quizzes-courses-service-db:
        condition: service_healthy
    restart: unless-stopped

  quizzes-courses-service-frontend:
    container_name: quizzes-courses-service-frontend
    build:
      context: ./quizzes-courses-service/frontend
    ports:
      - "127.0.0.1:3003:80"
    networks: [languagewise]
    depends_on:
      quizzes-courses-service-backend:
        condition: service_healthy
    restart: unless-stopped
