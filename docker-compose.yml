        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------- AI services --
  # Release 0 requires an Ollama runtime (specification section 4.2). No
  # application code calls it yet — that arrives with AI-Mode. Pull a model with:
  #
  #   docker compose exec ollama ollama pull qwen2.5:3b
  #
  # The model cache lives on a named volume so it survives `docker compose down`.
  #
  # If you also run Ollama natively on your machine it already owns port 11434
  # and this container will fail to start. Publish it somewhere else instead:
  #
  #   OLLAMA_PORT=11435 docker compose up -d        (bash)
  #   $env:OLLAMA_PORT=11435; docker compose up -d  (PowerShell)
  #
  # Or put OLLAMA_PORT=11435 in a .env file next to this one. Nothing inside the
  # network is affected — other containers always reach it at http://ollama:11434.

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks: [languagewise]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
