name: languagewise

networks:
  languagewise:
    driver: bridge

volumes:
  postgres-data:
  shared-images-data:
  chat-images-data:

# Generate using tools/gen-signing-key/gen-signing-key.ps1
secrets:
  signing_private_key:
    file: ./signing_private_key.pem
  signing_public_key:
    file: ./signing_public_key.pem
  # Generate using mcp-server/scripts/New-McpApiKey.ps1
  mcp_api_key:
    file: ./mcp-server/.mcp-api-key

services:
  garry-ai-service-backend:
    container_name: garry-ai-service-backend
    build:
      context: ./garry-ai-service/backend
    environment:
      OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-}
      OpenRouter__BaseUrl: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OpenRouter__Model: ${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it}
      OpenRouter__MaxOutputTokens: ${OPENROUTER_MAX_OUTPUT_TOKENS:-1024}
      Services__Database: http://shared-db-api:8080
      Auth__VerificationKeyPath: /run/secrets/signing_public_key
      Mcp__Enabled: "true"
      Mcp__Endpoint: http://host.docker.internal:8200/mcp
      Mcp__ApiKeyPath: /run/secrets/mcp_api_key
    secrets:
      - signing_public_key
      - mcp_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [languagewise]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  shared-db:
    container_name: shared-db
    build:
      context: ./shared/database/postgres
      additional_contexts:
        quests_sql: ./quests-achievements-notifications-service/database/sql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: languagewise
      POSTGRES_PASSWORD: languagewise
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    networks: [languagewise]
    restart: unless-stopped

  shared-db-api:
    container_name: shared-db-api
    build:
      context: ./shared/database
    environment:
      Database__ConnectionString: Host=shared-db;Database=shared;Username=shared_app;Password=languagewise
    volumes:
      - shared-images-data:/data/images
    ports:
      - "127.0.0.1:6000:8080"
    networks: [languagewise]
    depends_on:
      shared-db:
        condition: service_healthy
    restart: unless-stopped

  shared-backend:
    container_name: shared-backend
    build:
      context: ./shared/backend
    environment:
      Services__Database: http://shared-db-api:8080
      Services__Achievements: http://quests-achievements-notifications-service-backend:8080
      Services__Rag: http://host.docker.internal:8100
      Services__Garry: http://garry-ai-service-backend:8080
      Auth__SigningKeyPath: /run/secrets/signing_private_key
    secrets:
      - signing_private_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5000:8080"
    networks: [languagewise]
    depends_on:
      shared-db-api:
        condition: service_healthy
    restart: unless-stopped

  shared-frontend:
    container_name: shared-frontend
    build:
      context: ./shared/frontend
    ports:
      - "127.0.0.1:3000:80"
    networks: [languagewise]
    depends_on:
      shared-backend:
        condition: service_healthy
    restart: unless-stopped

  mini-games-service-db:
    container_name: mini-games-service-db
    build:
      context: ./mini-games-service/database
    environment:
      Database__ConnectionString: Host=shared-db;Database=mini_games;Username=mini_games_app;Password=languagewise
    ports:
      - "127.0.0.1:6005:8080"
    networks: [languagewise]
    depends_on:
      shared-db:
        condition: service_healthy
    restart: unless-stopped

  mini-games-service-backend:
    container_name: mini-games-service-backend
    build:
      context: ./mini-games-service/backend
    env_file:
      - path: ./mini-games-service/backend/.env
        required: false
    environment:
      Services__Database: http://mini-games-service-db:8080
      Services__Courses: http://quizzes-courses-service-backend:8080
      Services__Achievements: http://quests-achievements-notifications-service-backend:8080
      Services__Garry: http://garry-ai-service-backend:8080
      Auth__VerificationKeyPath: /run/secrets/signing_public_key
      Mcp__Enabled: "true"
      Mcp__Endpoint: http://host.docker.internal:8200/mcp
      Mcp__ApiKeyPath: /run/secrets/mcp_api_key
    secrets:
      - signing_public_key
      - mcp_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5001:8080"
    networks: [languagewise]
    depends_on:
      mini-games-service-db:
        condition: service_healthy
      garry-ai-service-backend:
        condition: service_healthy
    restart: unless-stopped

  mini-games-service-frontend:
    container_name: mini-games-service-frontend
    build:
      context: ./mini-games-service/frontend
    # No host port: reached through the shared-frontend gateway at /mini-games/.
    networks: [languagewise]
    depends_on:
      mini-games-service-backend:
        condition: service_healthy
    restart: unless-stopped

  quizzes-courses-service-db:
    container_name: quizzes-courses-service-db
    build:
      context: ./quizzes-courses-service/database
    environment:
      Database__ConnectionString: Host=shared-db;Database=quizzes_courses;Username=quizzes_courses_app;Password=languagewise
    ports:
      - "127.0.0.1:6003:8080"
    networks: [languagewise]
    depends_on:
      shared-db:
        condition: service_healthy
    restart: unless-stopped

  quizzes-courses-service-backend:
    container_name: quizzes-courses-service-backend
    build:
      context: ./quizzes-courses-service/backend
    environment:
      Services__Database: http://quizzes-courses-service-db:8080
      Services__Achievements: http://quests-achievements-notifications-service-backend:8080
      Services__Garry: http://garry-ai-service-backend:8080
      Auth__VerificationKeyPath: /run/secrets/signing_public_key
      Mcp__Enabled: "true"
      Mcp__Endpoint: http://host.docker.internal:8200/mcp
      Mcp__ApiKeyPath: /run/secrets/mcp_api_key
    secrets:
      - signing_public_key
      - mcp_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5003:8080"
    networks: [languagewise]
    depends_on:
      quizzes-courses-service-db:
        condition: service_healthy
      garry-ai-service-backend:
        condition: service_healthy
    restart: unless-stopped

  quizzes-courses-service-frontend:
    container_name: quizzes-courses-service-frontend
    build:
      context: ./quizzes-courses-service/frontend
    networks: [languagewise]
    depends_on:
      quizzes-courses-service-backend:
        condition: service_healthy
    restart: unless-stopped

  chat-discussion-service-db:
    container_name: chat-discussion-service-db
    build:
      context: ./chat-discussion-service/database
    environment:
      Database__ConnectionString: Host=shared-db;Database=chat_discussion;Username=chat_discussion_app;Password=languagewise
      Services__Courses: http://quizzes-courses-service-db:8080
      Services__Users: http://shared-db-api:8080
    volumes:
      - chat-images-data:/data
    ports:
      - "127.0.0.1:6002:8080"
    networks: [languagewise]
    depends_on:
      shared-db:
        condition: service_healthy
      quizzes-courses-service-db:
        condition: service_healthy
      shared-db-api:
        condition: service_healthy
    restart: unless-stopped

  chat-discussion-service-backend:
    container_name: chat-discussion-service-backend
    build:
      context: ./chat-discussion-service/backend
    environment:
      Services__Database: http://chat-discussion-service-db:8080
      Services__Achievements: http://quests-achievements-notifications-service-backend:8080
      Services__Garry: http://garry-ai-service-backend:8080
      Auth__VerificationKeyPath: /run/secrets/signing_public_key
      Mcp__Enabled: "true"
      Mcp__Endpoint: http://host.docker.internal:8200/mcp
      Mcp__ApiKeyPath: /run/secrets/mcp_api_key
    secrets:
      - signing_public_key
      - mcp_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5002:8080"
    networks: [languagewise]
    depends_on:
      chat-discussion-service-db:
        condition: service_healthy
      garry-ai-service-backend:
        condition: service_healthy
    restart: unless-stopped

  chat-discussion-service-frontend:
    container_name: chat-discussion-service-frontend
    build:
      context: ./chat-discussion-service/frontend
    networks: [languagewise]
    depends_on:
      chat-discussion-service-backend:
        condition: service_healthy
    restart: unless-stopped

  quests-achievements-notifications-service-db:
    container_name: quests-achievements-notifications-service-db
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://quests_app:languagewise@shared-db:5432/quests_achievements_notifications
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: web_anon
    networks: [languagewise]
    depends_on:
      shared-db:
        condition: service_healthy
    restart: unless-stopped

  quests-achievements-notifications-service-backend:
    container_name: quests-achievements-notifications-service-backend
    build:
      context: ./quests-achievements-notifications-service/backend
    env_file:
      - path: ./quests-achievements-notifications-service/backend/.env
        required: false
    environment:
      Services__Database: http://quests-achievements-notifications-service-db:3000
      Services__Garry: http://garry-ai-service-backend:8080
      OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-}
      OpenRouter__BaseUrl: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OpenRouter__Model: ${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it}
      Auth__VerificationKeyPath: /run/secrets/signing_public_key
      Mcp__Enabled: "true"
      Mcp__Endpoint: http://host.docker.internal:8200/mcp
      Mcp__ApiKeyPath: /run/secrets/mcp_api_key
    secrets:
      - signing_public_key
      - mcp_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5004:8080"
    networks: [languagewise]
    depends_on:
      quests-achievements-notifications-service-db:
        condition: service_started
      garry-ai-service-backend:
        condition: service_healthy
    restart: unless-stopped

  quests-achievements-notifications-service-frontend:
    container_name: quests-achievements-notifications-service-frontend
    build:
      context: ./quests-achievements-notifications-service/frontend
    networks: [languagewise]
    depends_on:
      quests-achievements-notifications-service-backend:
        condition: service_healthy
    restart: unless-stopped

  leaderboard-analytics-service-backend:
    container_name: leaderboard-analytics-service-backend
    build:
      context: ./leaderboard-analytics-service/backend
    env_file:
      - path: ./leaderboard-analytics-service/backend/.env
        required: false
    environment:
      Services__QuizzesCourses: http://quizzes-courses-service-backend:8080
      Services__Garry: http://garry-ai-service-backend:8080
      OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-}
      OpenRouter__BaseUrl: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OpenRouter__Model: ${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it}
      Auth__VerificationKeyPath: /run/secrets/signing_public_key
    secrets:
      - signing_public_key
    ports:
      - "127.0.0.1:5005:8080"
    networks: [languagewise]
    depends_on:
      quizzes-courses-service-backend:
        condition: service_healthy
      garry-ai-service-backend:
        condition: service_healthy
    restart: unless-stopped

  leaderboard-analytics-service-frontend:
    container_name: leaderboard-analytics-service-frontend
    build:
      context: ./leaderboard-analytics-service/frontend
    networks: [languagewise]
    depends_on:
      leaderboard-analytics-service-backend:
        condition: service_healthy
    restart: unless-stopped