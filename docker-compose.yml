  # --------------------- student 5 — Leaderboard and Analytics (Roan) --

  student-5-db:
    container_name: student-5-db
    build:
      context: .
      dockerfile: student-5/database/Dockerfile
    environment:
      Database__Path: /data/student-5.db
    volumes:
      - student-5-db-data:/data
    ports:
      - "6005:8080"
    networks: [languagewise]
    restart: unless-stopped

  student-5-backend:
    container_name: student-5-backend
    build:
      context: .
      dockerfile: student-5/backend/Dockerfile
    environment:
      Services__Database: http://student-5-db:8080
    ports:
      - "5005:8080"
    networks: [languagewise]
    depends_on:
      student-5-db:
        condition: service_healthy
    restart: unless-stopped

  student-5-frontend:
    container_name: student-5-frontend
    build:
      context: .
      dockerfile: student-5/frontend/Dockerfile
    ports:
      - "3005:80"
    networks: [languagewise]
    depends_on:
      student-5-backend:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------- AI services --
  # Release 0 requires an Ollama runtime (specification section 4.2). No
  # application code calls it yet — that arrives with AI-Mode. Pull a model with:
  #
  #   docker compose exec ollama ollama pull qwen2.5:3b
  #
  # The model cache lives on a named volume so it survives `docker compose down`.

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    networks: [languagewise]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
