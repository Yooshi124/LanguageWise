# =============================================================================
# LanguageWise — integrated Release 0 application
# =============================================================================
#
#   docker compose up --build          start everything
#   docker compose down                stop everything (keeps the databases)
#   docker compose down -v             stop everything and wipe the databases
#
# Every microservice is three containers plus one named volume:
#
#   <name>-frontend   nginx serving static HTML/CSS/JS, proxies /api/ to the backend
#   <name>-backend    ASP.NET Core minimal API, calls the database service over HTTP
#   <name>-db         ASP.NET Core minimal API owning the SQLite file, exposes CRUD
#   <name>-db-data    named volume holding the SQLite file
#
# Only the database service ever opens its SQLite file, so no volume is shared
# between containers. All .NET containers listen on 8080 inside the network; the
# host port mapping below matches the Release 0 architecture diagram.
#
# Host ports:  frontends 3000-3005 · backends 5000-5005 · databases 6000-6005
#
# NOTE: every build context is the repository root, because the .NET images need
#       Directory.Build.props / Directory.Packages.props and the frontend images
#       need the shared CSS theme from shared/frontend/css/.
# =============================================================================

name: languagewise

networks:
  languagewise:
    driver: bridge

volumes:
  shared-db-data:
  student-1-db-data:
  student-2-db-data:
  student-3-db-data:
  student-4-db-data:
  student-5-db-data:
  ollama-models:

services:

  # ---------------------------------------------------------------- shared --
  # The team-owned microservice. Its frontend is the unified home page that
  # routes to every student feature (specification section 2.3).

  shared-db:
    container_name: shared-db
    build:
      context: .
      dockerfile: shared/database/Dockerfile
    environment:
      Database__Path: /data/shared.db
    volumes:
      - shared-db-data:/data
    ports:
      - "6000:8080"
    networks: [languagewise]
    restart: unless-stopped

  shared-backend:
    container_name: shared-backend
    build:
      context: .
      dockerfile: shared/backend/Dockerfile
    environment:
      Services__Database: http://shared-db:8080
    ports:
      - "5000:8080"
    networks: [languagewise]
    depends_on:
      shared-db:
        condition: service_healthy
    restart: unless-stopped

  shared-frontend:
    container_name: shared-frontend
    build:
      context: .
      dockerfile: shared/frontend/Dockerfile
    ports:
      - "3000:80"
    networks: [languagewise]
    depends_on:
      shared-backend:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------- student 1 — Mini Games (Kyan) --

  student-1-db:
    container_name: student-1-db
    build:
      context: .
      dockerfile: student-1/database/Dockerfile
    environment:
      Database__Path: /data/student-1.db
    volumes:
      - student-1-db-data:/data
    ports:
      - "6001:8080"
    networks: [languagewise]
    restart: unless-stopped

  student-1-backend:
    container_name: student-1-backend
    build:
      context: .
      dockerfile: student-1/backend/Dockerfile
    environment:
      Services__Database: http://student-1-db:8080
    ports:
      - "5001:8080"
    networks: [languagewise]
    depends_on:
      student-1-db:
        condition: service_healthy
    restart: unless-stopped

  student-1-frontend:
    container_name: student-1-frontend
    build:
      context: .
      dockerfile: student-1/frontend/Dockerfile
    ports:
      - "3001:80"
    networks: [languagewise]
    depends_on:
      student-1-backend:
        condition: service_healthy
    restart: unless-stopped

