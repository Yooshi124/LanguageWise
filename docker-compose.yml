      - chat-discussion-service-db-data:/data
    ports:
      - "6002:8080"
    networks: [languagewise]
    restart: unless-stopped

  chat-discussion-service-backend:
    container_name: chat-discussion-service-backend
    build:
      context: ./chat-discussion-service/backend
    environment:
      Services__Database: http://chat-discussion-service-db:8080
    ports:
      - "5002:8080"
    networks: [languagewise]
    depends_on:
      chat-discussion-service-db:
        condition: service_healthy
    restart: unless-stopped

  chat-discussion-service-frontend:
    container_name: chat-discussion-service-frontend
    build:
      context: ./chat-discussion-service/frontend
    ports:
      - "3002:80"
    networks: [languagewise]
    depends_on:
