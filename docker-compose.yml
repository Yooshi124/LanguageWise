name: languagewise

networks:
  languagewise:
    driver: bridge

volumes:
  shared-db-data:
  quizzes-courses-service-db-data:
  quests-achievements-notifications-service-db-data:

services:
  shared-db:
    container_name: shared-db
    build:
      context: ./shared/database
    environment:
      Database__Path: /data/shared.db
    volumes:
      - shared-db-data:/data
    ports:
      - "127.0.0.1:6000:8080"
    networks: [languagewise]
    restart: unless-stopped

  shared-backend:
    container_name: shared-backend
    build:
      context: ./shared/backend
    environment:
      Services__Database: http://shared-db:8080
    ports:
      - "127.0.0.1:5000:8080"
    networks: [languagewise]
    depends_on:
      shared-db:
        condition: service_healthy
    restart: unless-stopped

  shared-frontend:
    container_name: shared-frontend
    build:
      context: ./shared/frontend
    ports:
      - "127.0.0.1:3000:80"
    networks: [languagewise]
    depends_on:
      shared-backend:
        condition: service_healthy
    restart: unless-stopped

  quizzes-courses-service-db:
    container_name: quizzes-courses-service-db
    build:
      context: ./quizzes-courses-service/database
    environment:
      Database__Path: /data/quizzes-courses-service.db
    volumes:
      - quizzes-courses-service-db-data:/data
    ports:
      - "127.0.0.1:6003:8080"
    networks: [languagewise]
    restart: unless-stopped

  quizzes-courses-service-backend:
    container_name: quizzes-courses-service-backend
    build:
      context: ./quizzes-courses-service/backend
    environment:
      Services__Database: http://quizzes-courses-service-db:8080
    ports:
      - "127.0.0.1:5003:8080"
    networks: [languagewise]
    depends_on:
      quizzes-courses-service-db:
        condition: service_healthy
    restart: unless-stopped

  quizzes-courses-service-frontend:
    container_name: quizzes-courses-service-frontend
    build:
      context: ./quizzes-courses-service/frontend
    ports:
      - "127.0.0.1:3003:80"
    networks: [languagewise]
    depends_on:
      quizzes-courses-service-backend:
        condition: service_healthy
    restart: unless-stopped

  quests-achievements-notifications-service-db:
    container_name: quests-achievements-notifications-service-db
    build:
      context: ./quests-achievements-notifications-service/database
    environment:
      POSTGRES_DB: quests_achievements_notifications
      POSTGRES_USER: languagewise
      POSTGRES_PASSWORD: languagewise
    volumes:
      - quests-achievements-notifications-service-db-data:/var/lib/postgresql
    networks: [languagewise]
    restart: unless-stopped

  quests-achievements-notifications-service-db-api:
    container_name: quests-achievements-notifications-service-db-api
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://languagewise:languagewise@quests-achievements-notifications-service-db:5432/quests_achievements_notifications
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: web_anon
    networks: [languagewise]
    depends_on:
      quests-achievements-notifications-service-db:
        condition: service_healthy
    restart: unless-stopped

  quests-achievements-notifications-service-backend:
    container_name: quests-achievements-notifications-service-backend
    build:
      context: ./quests-achievements-notifications-service/backend
    environment:
      Services__Database: http://quests-achievements-notifications-service-db-api:3000
    ports:
      - "5004:8080"
    networks: [languagewise]
    depends_on:
      quests-achievements-notifications-service-db-api:
        condition: service_started
    restart: unless-stopped

  quests-achievements-notifications-service-frontend:
    container_name: quests-achievements-notifications-service-frontend
    build:
      context: ./quests-achievements-notifications-service/frontend
    ports:
      - "3004:80"
    networks: [languagewise]
    depends_on:
      quests-achievements-notifications-service-backend:
        condition: service_healthy
    restart: unless-stopped