name: languagewise

networks:
  languagewise:
    driver: bridge

volumes:
  shared-db-data:
  quizzes-courses-service-db-data:
  chat-discussion-service-db-data:
  quests-achievements-notifications-service-db-data:
  mini-games-service-db-data:
  leaderboard-analytics-service-db-data:
  ollama-data:

# Generate using tools/gen-signing-key/gen-signing-key.ps1
secrets:
  signing_private_key:
    file: ./signing_private_key.pem
  signing_public_key:
    file: ./signing_public_key.pem

services:
  ollama:
    container_name: ollama
    image: ollama/ollama:0.33.1
    gpus: all
    environment:
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama-data:/root/.ollama
    networks: [languagewise]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-model-init:
    container_name: ollama-model-init
    image: ollama/ollama:0.33.1
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull gemma4:e4b && ollama run gemma4:e4b \"\""]
    networks: [languagewise]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  shared-db:
    container_name: shared-db
    build:
      context: ./shared/database
    environment:
      Database__Path: /data/shared.db
    volumes:
      - shared-db-data:/data
    ports:
      - "127.0.0.1:6000:8080"
    networks: [languagewise]
    restart: unless-stopped

  shared-backend:
    container_name: shared-backend
    build:
      context: ./shared/backend
    environment:
      Services__Database: http://shared-db:8080
      Auth__SigningKeyPath: /run/secrets/signing_private_key
    secrets:
      - signing_private_key
    ports:
      - "127.0.0.1:5000:8080"
    networks: [languagewise]
    depends_on:
      shared-db:
        condition: service_healthy
    restart: unless-stopped

  shared-frontend:
    container_name: shared-frontend
    build:
      context: ./shared/frontend
    ports:
      - "127.0.0.1:3000:80"
    networks: [languagewise]
    depends_on:
      shared-backend:
        condition: service_healthy
    restart: unless-stopped

  mini-games-service-db:
    container_name: mini-games-service-db
    build:
      context: ./mini-games-service/database
    environment:
      Database__Path: /data/mini-games-service.db
    volumes:
      - mini-games-service-db-data:/data
    ports:
      - "127.0.0.1:6005:8080"
    networks: [languagewise]
    restart: unless-stopped

  mini-games-service-backend:
    container_name: mini-games-service-backend
    build:
      context: ./mini-games-service/backend
    env_file:
      - path: ./mini-games-service/backend/.env
        required: false
    environment:
      Services__Database: http://mini-games-service-db:8080
      Services__Courses: http://quizzes-courses-service-backend:8080
    ports:
      - "127.0.0.1:5001:8080"
    networks: [languagewise]
    depends_on:
      mini-games-service-db:
        condition: service_started
    restart: unless-stopped

  mini-games-service-frontend:
    container_name: mini-games-service-frontend
    build:
      context: ./mini-games-service/frontend
    # No host port: reached through the shared-frontend gateway at /mini-games/.
    networks: [languagewise]
    depends_on:
      mini-games-service-backend:
        condition: service_healthy
    restart: unless-stopped

  quizzes-courses-service-db:
    container_name: quizzes-courses-service-db
    build:
      context: ./quizzes-courses-service/database
    environment:
      Database__Path: /data/quizzes-courses-service.db
    volumes:
      - quizzes-courses-service-db-data:/data
    ports:
      - "127.0.0.1:6003:8080"
    networks: [languagewise]
    restart: unless-stopped

  quizzes-courses-service-backend:
    container_name: quizzes-courses-service-backend
    build:
      context: ./quizzes-courses-service/backend
    env_file:
      - path: ./quizzes-courses-service/backend/.env
        required: false
    environment:
      Services__Database: http://quizzes-courses-service-db:8080
      Auth__VerificationKeyPath: /run/secrets/signing_public_key
    secrets:
      - signing_public_key
    ports:
      - "127.0.0.1:5003:8080"
    networks: [languagewise]
    depends_on:
      quizzes-courses-service-db:
        condition: service_healthy
    restart: unless-stopped

  quizzes-courses-service-frontend:
    container_name: quizzes-courses-service-frontend
    build:
      context: ./quizzes-courses-service/frontend
    networks: [languagewise]
    depends_on:
      quizzes-courses-service-backend:
        condition: service_healthy
    restart: unless-stopped

  chat-discussion-service-db:
    container_name: chat-discussion-service-db
    build:
      context: ./chat-discussion-service/database
    environment:
      Database__Path: /data/chat-discussion-service.db
    volumes:
      - chat-discussion-service-db-data:/data
    ports:
      - "127.0.0.1:6002:8080"
    networks: [languagewise]
    restart: unless-stopped

  chat-discussion-service-backend:
    container_name: chat-discussion-service-backend
    build:
      context: ./chat-discussion-service/backend
    environment:
      Services__Database: http://chat-discussion-service-db:8080
      Auth__VerificationKeyPath: /run/secrets/signing_public_key
    secrets:
      - signing_public_key
    ports:
      - "127.0.0.1:5002:8080"
    networks: [languagewise]
    depends_on:
      chat-discussion-service-db:
        condition: service_healthy
    restart: unless-stopped

  chat-discussion-service-frontend:
    container_name: chat-discussion-service-frontend
    build:
      context: ./chat-discussion-service/frontend
    ports:
      - "127.0.0.1:3002:80"
    networks: [languagewise]
    depends_on:
      chat-discussion-service-backend:
        condition: service_healthy
    restart: unless-stopped

  quests-achievements-notifications-service-db:
    container_name: quests-achievements-notifications-service-db
    build:
      context: ./quests-achievements-notifications-service/database
    environment:
      POSTGRES_DB: quests_achievements_notifications
      POSTGRES_USER: languagewise
      POSTGRES_PASSWORD: languagewise
    volumes:
      - quests-achievements-notifications-service-db-data:/var/lib/postgresql
    networks: [languagewise]
    restart: unless-stopped

  quests-achievements-notifications-service-db-api:
    container_name: quests-achievements-notifications-service-db-api
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://languagewise:languagewise@quests-achievements-notifications-service-db:5432/quests_achievements_notifications
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: web_anon
    networks: [languagewise]
    depends_on:
      quests-achievements-notifications-service-db:
        condition: service_healthy
    restart: unless-stopped

  quests-achievements-notifications-service-backend:
    container_name: quests-achievements-notifications-service-backend
    build:
      context: ./quests-achievements-notifications-service/backend
    env_file:
      - path: ./quests-achievements-notifications-service/backend/.env
        required: false
    environment:
      Services__Database: http://quests-achievements-notifications-service-db-api:3000
      Services__Ollama: http://ollama:11434
      Ollama__Model: gemma4:e4b
      Auth__VerificationKeyPath: /run/secrets/signing_public_key
    secrets:
      - signing_public_key
    ports:
      - "5004:8080"
    networks: [languagewise]
    depends_on:
      quests-achievements-notifications-service-db-api:
        condition: service_started
      ollama-model-init:
        condition: service_completed_successfully
    restart: unless-stopped

  quests-achievements-notifications-service-frontend:
    container_name: quests-achievements-notifications-service-frontend
    build:
      context: ./quests-achievements-notifications-service/frontend
    networks: [languagewise]
    depends_on:
      quests-achievements-notifications-service-backend:
        condition: service_healthy
    restart: unless-stopped

  leaderboard-analytics-service-db:
    container_name: leaderboard-analytics-service-db
    build:
      context: ./leaderboard-analytics-service/database
    environment:
      Database__Path: /data/leaderboard-analytics-service.db
    volumes:
      - leaderboard-analytics-service-db-data:/data
    ports:
      - "127.0.0.1:5006:8080"
    networks: [languagewise]
    restart: unless-stopped

  leaderboard-analytics-service-backend:
    container_name: leaderboard-analytics-service-backend
    build:
      context: ./leaderboard-analytics-service/backend
    environment:
      Services__Database: http://leaderboard-analytics-service-db:8080
      Auth__VerificationKeyPath: /run/secrets/signing_public_key
    secrets:
      - signing_public_key
    ports:
      - "127.0.0.1:5005:8080"
    networks: [languagewise]
    depends_on:
      leaderboard-analytics-service-db:
        condition: service_healthy
    restart: unless-stopped

  leaderboard-analytics-service-frontend:
    container_name: leaderboard-analytics-service-frontend
    build:
      context: ./leaderboard-analytics-service/frontend
    networks: [languagewise]
    depends_on:
      leaderboard-analytics-service-backend:
        condition: service_healthy
    restart: unless-stopped