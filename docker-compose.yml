      Services__Database: http://mini-games-service-db:8080
    ports:
      - "5001:8080"
    networks: [languagewise]
    depends_on:
      mini-games-service-db:
        condition: service_healthy
    restart: unless-stopped

  mini-games-service-frontend:
    container_name: mini-games-service-frontend
    build:
      context: ./mini-games-service/frontend
    ports:
      - "3001:80"
    networks: [languagewise]
    depends_on:
      mini-games-service-backend:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------- chat-discussion-service — Discussion Forum (Lachlan) --

  chat-discussion-service-db:
    container_name: chat-discussion-service-db
