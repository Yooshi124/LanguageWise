# =============================================================================
# LanguageWise — integrated Release 0 application
# =============================================================================
#
#   docker compose up --build          start everything
#   docker compose down                stop everything (keeps the databases)
#   docker compose down -v             stop everything and wipe the databases
#
# Every microservice is three containers plus one named volume:
#
#   <service>-frontend   nginx serving the built frontend, proxies /api/ to the backend
#   <service>-backend    ASP.NET Core minimal API, calls the database service over HTTP
#   <service>-db         ASP.NET Core minimal API owning the SQLite file, exposes CRUD
#   <service>-db-data    named volume holding the SQLite file
#
# Only the database service ever opens its SQLite file, so no volume is shared
# between containers. All .NET containers listen on 8080 inside the network; the
# host port mapping below matches the Release 0 architecture diagram.
#
# Host ports:  frontends 3000-3005 · backends 5000-5005 · databases 6000-6005
#
# Each build context is a single tier folder (for example ./shared/backend), so
# no image can read anything belonging to another microservice or another tier.
# That is what lets a service be built and run entirely on its own:
#
#   docker build -t lw-shared-backend ./shared/backend
#
# Healthchecks live in the Dockerfiles rather than here, so they apply however
# the image is started.
# =============================================================================

name: languagewise

networks:
  languagewise:
    driver: bridge

volumes:
  shared-db-data:
  mini-games-service-db-data:
  chat-discussion-service-db-data:
  quizzes-courses-service-db-data:
  quests-achievements-notifications-service-db-data:
  leaderboard-analytics-service-db-data:
  ollama-models:

services:

  # ----------------------------------------- shared — unified home page (Team) --

  shared-db:
    container_name: shared-db
    build:
      context: ./shared/database
    environment:
      Database__Path: /data/shared.db
    volumes:
      - shared-db-data:/data
    ports:
      - "6000:8080"
    networks: [languagewise]
    restart: unless-stopped

  shared-backend:
    container_name: shared-backend
    build:
      context: ./shared/backend
    environment:
      Services__Database: http://shared-db:8080
    ports:
      - "5000:8080"
    networks: [languagewise]
    depends_on:
      shared-db:
        condition: service_healthy
    restart: unless-stopped

  shared-frontend:
    container_name: shared-frontend
    build:
      context: ./shared/frontend
    ports:
      - "3000:80"
    networks: [languagewise]
    depends_on:
      shared-backend:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------ mini-games-service — Mini Games (Kyan) --

  mini-games-service-db:
    container_name: mini-games-service-db
    build:
      context: ./mini-games-service/database
    environment:
      Database__Path: /data/mini-games-service.db
    volumes:
      - mini-games-service-db-data:/data
    ports:
      - "6001:8080"
    networks: [languagewise]
    restart: unless-stopped

  mini-games-service-backend:
    container_name: mini-games-service-backend
    build:
      context: ./mini-games-service/backend
