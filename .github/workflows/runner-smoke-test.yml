name: Runner Smoke Test

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: languagewise-runner-smoke-test
  cancel-in-progress: false

jobs:
  runner-smoke-test:
    if: github.repository == 'Yooshi124/LanguageWise' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, languagewise-deploy]
    timeout-minutes: 5

    steps:
      - name: Verify runner execution
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" -ne 0
          printf 'Runner: %s\n' "$RUNNER_NAME"
          uname -s -m

      - name: Verify GitHub HTTPS access
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null https://github.com/robots.txt
          printf 'Runner smoke test passed.\n'