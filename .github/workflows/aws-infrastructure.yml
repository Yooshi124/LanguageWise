name: AWS Infrastructure Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-infrastructure-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_EC2_METADATA_DISABLED: 'true'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  Mcp__Enabled: 'false'
  Rag__Enabled: 'false'

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test control, expiry, release and nginx contracts
        run: node --test infra/tests/*.test.mjs infra/foundation/contract.test.mjs shared/tests/frontend-runtime.test.mjs
      - name: Test database bootstrap without credentials
        run: python3 -B infra/scripts/initialize-databases.tests.py

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, foundation, demo]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - run: terraform -chdir=infra/${{ matrix.root }} fmt -check -recursive
      - run: terraform -chdir=infra/${{ matrix.root }} init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/${{ matrix.root }} validate
      - if: matrix.root == 'demo'
        run: terraform -chdir=infra/demo test
      - if: matrix.root == 'demo'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce discovery refresh with the pinned native provider offline
        if: matrix.root == 'demo'
        run: node infra/scripts/check-discovery-refresh.mjs

  garry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test garry-ai-service/LanguageWise.GarryAiService.BE.slnx -c Release --logger trx