# =============================================================================
# Quizzes and Courses — build and validate
# =============================================================================
# Owned by Justin. Builds and tests `quizzes-courses-service` on its own: the
# microservice has no dependency on any other folder in this repository, so a
# failure here can only be caused by this service.
#
# This workflow deliberately has NO path filter. Required status checks are
# matched by job name, and a workflow that never runs never reports a result,
# which would leave pull requests waiting for a check that can never arrive.
# =============================================================================

name: quizzes-courses-service

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quizzes-courses-service-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: quizzes-courses-service/LanguageWise.QuizzesCoursesService.BE.slnx

jobs:
  # The job name below is what you add to the branch ruleset as a required check.
  quizzes-courses-service-build-and-test:
    name: quizzes-courses-service-build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Guards against files that exist locally but were never committed — for
      # example because a .gitignore rule swallowed them. Without this the build
      # fails later with a bare 'MSB1009: Project file does not exist'.
      - name: Verify the service layout is complete
        shell: bash
        run: |
          missing=0
          for path in \
            "quizzes-courses-service/LanguageWise.QuizzesCoursesService.BE.slnx" \
            "quizzes-courses-service/backend/LanguageWise.QuizzesCoursesService.Api/LanguageWise.QuizzesCoursesService.Api.csproj" \
            "quizzes-courses-service/database/LanguageWise.QuizzesCoursesService.Db/LanguageWise.QuizzesCoursesService.Db.csproj" \
            "quizzes-courses-service/tests/LanguageWise.QuizzesCoursesService.Api.Tests/LanguageWise.QuizzesCoursesService.Api.Tests.csproj" \
            "quizzes-courses-service/backend/Dockerfile" \
            "quizzes-courses-service/database/Dockerfile" \
            "quizzes-courses-service/frontend/Dockerfile" ; do
            if [ ! -f "$path" ]; then
              echo "::error file=$path::Missing from the repository. It may exist locally but be untracked — check .gitignore."
              missing=1
            fi
          done
          exit $missing

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-quizzes-courses-service-${{ hashFiles('quizzes-courses-service/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-quizzes-courses-service-
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" -c Release --no-restore

      - name: Run NUnit tests
        run: >
          dotnet test "${{ env.SOLUTION }}"
          -c Release --no-build
          --logger "trx;LogFileName=quizzes-courses-service.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quizzes-courses-service-test-results
          path: TestResults/
          if-no-files-found: warn

      # Each tier builds from its own folder as the context, which proves the
      # image does not reach outside the microservice.
      - name: Build the database image
        run: docker build -t languagewise/quizzes-courses-service-db:ci ./quizzes-courses-service/database

      - name: Build the backend image
        run: docker build -t languagewise/quizzes-courses-service-backend:ci ./quizzes-courses-service/backend

      - name: Build the frontend image
        run: docker build -t languagewise/quizzes-courses-service-frontend:ci ./quizzes-courses-service/frontend