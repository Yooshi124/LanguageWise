name: leaderboard-analytics-service

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard-analytics-service-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: leaderboard-analytics-service/LanguageWise.LeaderboardAnalyticsService.BE.slnx
  Mcp__Enabled: false
  Rag__Enabled: false

jobs:
  leaderboard-analytics-service-build-and-test:
    name: leaderboard-analytics-service-build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-leaderboard-analytics-service-${{ hashFiles('leaderboard-analytics-service/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-leaderboard-analytics-service-
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Verify MCP and RAG are disabled in CI
        shell: bash
        run: |
          for flag in Mcp__Enabled Rag__Enabled; do
            if [ "${!flag}" != "false" ]; then
              echo "::error::$flag must be false in CI; tests use fakes and never contact the local MCP or RAG server."
              exit 1
            fi
          done
          echo "Mcp__Enabled=false, Rag__Enabled=false: no local MCP or RAG server is contacted."

      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" -c Release --no-restore

      - name: Run NUnit tests
        run: >
          dotnet test "${{ env.SOLUTION }}"
          -c Release --no-build
          --logger "trx;LogFileName=leaderboard-analytics-service.trx"
          --results-directory TestResults

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: leaderboard-analytics-service/frontend/package-lock.json

      - name: Run frontend Vitest tests
        working-directory: leaderboard-analytics-service/frontend
        run: |
          npm ci
          npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-analytics-service-test-results
          path: TestResults/
          if-no-files-found: warn

      # Post-commit (push to master only): runs each student's two assigned
      # endpoint tests and writes per-student reports. See tools/testing/.
      - name: Run student endpoint tests
        if: github.event_name == 'push'
        run: |
          filter=$(python3 tools/testing/student_endpoints.py filter --service leaderboard-analytics-service)
          dotnet test "${{ env.SOLUTION }}" -c Release --no-build \
            --filter "$filter" \
            --logger "trx;LogFileName=student-endpoints.trx" \
            --results-directory reports/post-commit/leaderboard-analytics-service

      - name: Write student endpoint reports
        if: always() && github.event_name == 'push'
        run: >
          python3 tools/testing/student_endpoints.py report --service leaderboard-analytics-service
          --results-dir reports/post-commit/leaderboard-analytics-service

      - name: Upload post-commit reports
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-analytics-service-post-commit-reports
          path: reports/post-commit/
          if-no-files-found: warn

      - name: Build the backend image
        run: docker build -t languagewise/leaderboard-analytics-service-backend:ci ./leaderboard-analytics-service/backend

      - name: Build the frontend image
        run: docker build -t languagewise/leaderboard-analytics-service-frontend:ci ./leaderboard-analytics-service/frontend