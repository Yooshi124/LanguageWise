# Setup: pipx install pre-commit && pre-commit install
exclude: '(^|/)(node_modules|dist|bin|obj|\.venv|venv|TestResults)/'

repos:
  - repo: local
    hooks:
      # Runs first so the report header lists the run context before any hook result.
      - id: run-context
        name: Run context
        entry: python tools/security/precommit_context.py
        language: python
        always_run: true
        pass_filenames: true
        verbose: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        name: ruff (security rules)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: '(^|/)package-lock\.json$'

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        # chromadb (rag-server) advisories with no fixed release yet; remove once one ships.
        args:
          - -r
          - rag-server/requirements.txt
          - -r
          - tools/agentic-loop/requirements.txt
          - -r
          - tests/e2e/requirements.txt
          - --ignore-vuln=PYSEC-2026-311
          - --ignore-vuln=PYSEC-2026-3813
          - --ignore-vuln=PYSEC-2026-3814
          - --ignore-vuln=PYSEC-2026-3815
        files: ^(rag-server|tools/agentic-loop|tests/e2e)/requirements\.txt$

  - repo: local
    hooks:
      - id: npm-audit
        name: npm audit (frontends)
        entry: python tools/security/audit_deps.py npm
        language: python
        files: (^|/)package(-lock)?\.json$
      - id: dotnet-vulnerable
        name: dotnet vulnerable packages (backends)
        entry: python tools/security/audit_deps.py dotnet
        language: python
        require_serial: true
        files: \.(slnx|csproj|props|targets)$|(^|/)nuget\.config$
