# nginx configuration for the shared frontend container.
#
# Serves the static build output and reverse-proxies every /api/ call to this
# service's own backend over the Docker network, so the browser talks to a
# single origin and no CORS configuration is needed.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the upstream per request through a
    # variable means nginx still starts when the backend is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        access_log   off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"shared-frontend"}';
    }

    location /api/ {
        set $lw_backend "http://shared-backend:8080";
        rewrite ^/api/(.*)$ /api/$1 break;
        proxy_pass $lw_backend;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Quests and achievements proxy
    location /quests-and-achievements/api/ {
        set $quests_backend "http://quests-achievements-notifications-service-backend:8080";
        rewrite ^/quests-and-achievements/api/(.*)$ /api/$1 break;
        proxy_pass $quests_backend;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location /quests-and-achievements/ {
        set $quests_frontend "http://quests-achievements-notifications-service-frontend:80";
        rewrite ^/quests-and-achievements/(.*)$ /$1 break;
        proxy_pass $quests_frontend;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Quizzes and courses proxy
    location /quizzes-and-courses/ {
        set $qc_frontend "http://quizzes-courses-service-frontend:80";
        rewrite ^/quizzes-and-courses/(.*)$ /$1 break;
        proxy_pass $qc_frontend;

        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location = /quizzes-and-courses/api/assistant/messages {
        set $qc_backend "http://quizzes-courses-service-backend:8080";
        rewrite ^/quizzes-and-courses/api/(.*)$ /api/$1 break;
        proxy_pass $qc_backend;

        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location /quizzes-and-courses/api/ {
        set $qc_backend "http://quizzes-courses-service-backend:8080";
        rewrite ^/quizzes-and-courses/api/(.*)$ /api/$1 break;
        proxy_pass $qc_backend;

        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Mini Games proxy
    location /mini-games/ {
        set $mg_frontend "http://mini-games-service-frontend:80";
        rewrite ^/mini-games/(.*)$ /$1 break;
        proxy_pass $mg_frontend;

        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location /mini-games/api/ {
        set $mg_backend "http://mini-games-service-backend:8080";
        rewrite ^/mini-games/api/(.*)$ /api/$1 break;
        proxy_pass $mg_backend;

        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Analytics proxy
    location /analytics/ {
        set $analytics_frontend "http://leaderboard-analytics-service-frontend:80";
        rewrite ^/analytics/(.*)$ /$1 break;
        proxy_pass $analytics_frontend;

        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location /analytics/api/ {
        set $analytics_backend "http://leaderboard-analytics-service-backend:8080";
        rewrite ^/analytics/api/(.*)$ /api/$1 break;
        proxy_pass $analytics_backend;

        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Chat discussion proxy
    location /chat-discussion/ {
        set $chat_frontend "http://chat-discussion-service-frontend:80";
        rewrite ^/chat-discussion/(.*)$ /$1 break;
        proxy_pass $chat_frontend;

        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location /chat-discussion/api/ {
        set $chat_backend "http://chat-discussion-service-backend:8080";
        rewrite ^/chat-discussion/api/(.*)$ /api/$1 break;
        proxy_pass $chat_backend;

        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}