# nginx configuration for the shared frontend microservice.
#
# The frontend container serves static HTML, CSS and JavaScript only. Every call
# to /api/ is reverse-proxied to the shared backend over the internal Docker
# network, so the browser only ever talks to one origin and no CORS is needed.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Resolving the upstream at request time (via a
    # variable) rather than at start-up means nginx still boots if the backend
    # container is not ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        access_log   off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"shared-frontend"}';
    }

    location /api/ {
        set $lw_backend "http://shared-backend:8080";
        proxy_pass $lw_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
