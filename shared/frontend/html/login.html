<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LanguageWise &mdash; Login</title>
    <link rel="icon" href="/assets/languagewise-icon.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/languagewise-icon.png">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        :root {
            --lw-login-primary: #4f46e5;
            --lw-login-primary-dark: #3730a3;
            --lw-login-navy: #151a2d;
        }
        body {
            min-width: 320px;
        }
        .lw-login {
            position: relative;
            display: grid;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: clamp(1rem, 4vw, 3rem);
            overflow: hidden;
            background:
                radial-gradient(circle at 12% 15%, rgba(99, 102, 241, 0.18), transparent 30rem),
                radial-gradient(circle at 90% 88%, rgba(16, 185, 129, 0.12), transparent 26rem),
                #f6f7fb;
        }
        .lw-login::before,
        .lw-login::after {
            position: absolute;
            width: 18rem;
            height: 18rem;
            border: 1px solid rgba(79, 70, 229, 0.12);
            border-radius: 50%;
            content: "";
        }
        .lw-login::before {
            top: -10rem;
            right: 12%;
        }
        .lw-login::after {
            bottom: -12rem;
            left: 8%;
        }
        .lw-login__shell {
            position: relative;
            z-index: 1;
            display: grid;
            width: 100%;
            max-width: 960px;
            min-height: 590px;
            grid-template-columns: minmax(0, 0.9fr) minmax(380px, 1.1fr);
            overflow: hidden;
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 28px;
            background: #ffffff;
            box-shadow: 0 32px 80px rgba(15, 23, 42, 0.18);
        }
        .lw-login__brand-panel {
            position: relative;
            display: flex;
            padding: clamp(2rem, 5vw, 3.5rem);
            flex-direction: column;
            color: #ffffff;
            background:
                radial-gradient(circle at 20% 15%, rgba(129, 140, 248, 0.3), transparent 17rem),
                linear-gradient(155deg, #202744, var(--lw-login-navy));
        }
        .lw-login__brand-panel::after {
            position: absolute;
            right: -5rem;
            bottom: -6rem;
            width: 18rem;
            height: 18rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            box-shadow:
                0 0 0 2.5rem rgba(255, 255, 255, 0.025),
                0 0 0 5rem rgba(255, 255, 255, 0.018);
            content: "";
        }
        .lw-login__brand {
            position: relative;
            z-index: 1;
            display: inline-flex;
            width: fit-content;
            align-items: center;
            gap: 0.85rem;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-decoration: none;
        }
        .lw-login__logo {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 12px 30px rgba(79, 70, 229, 0.42);
        }
        .lw-login__brand-copy {
            position: relative;
            z-index: 1;
            margin: auto 0;
        }
        .lw-login__brand-copy h2 {
            max-width: 340px;
            margin: 0 0 1rem;
            font-size: clamp(2.35rem, 5vw, 3.8rem);
            line-height: 1.02;
            letter-spacing: -0.055em;
        }
        .lw-login__brand-copy h2 span {
            color: #a5b4fc;
        }
        .lw-login__brand-copy p {
            max-width: 330px;
            margin: 0;
            color: #cbd1e4;
            font-size: 1.02rem;
            line-height: 1.7;
        }
        .lw-login__promise {
            position: relative;
            z-index: 1;
            margin: 0;
            color: #9ca6c3;
            font-size: 0.82rem;
            font-weight: 650;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .lw-login__form-panel {
            display: flex;
            padding: clamp(2rem, 6vw, 4.5rem);
            flex-direction: column;
            justify-content: center;
        }
        .lw-login__eyebrow {
            margin: 0 0 0.65rem;
            color: var(--lw-login-primary);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }
        .lw-login__title {
            margin: 0;
            color: #172033;
            font-size: clamp(2rem, 4vw, 2.8rem);
            line-height: 1.1;
            letter-spacing: -0.045em;
        }
        .lw-login__subtitle {
            margin: 0.85rem 0 2rem;
            color: #667085;
        }
        .lw-login__form {
            width: 100%;
        }
        .lw-login__field {
            margin-bottom: 1.15rem;
        }
        .lw-login__label {
            display: block;
            margin-bottom: 0.45rem;
            color: #344054;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .lw-login__input {
            width: 100%;
            min-height: 50px;
            padding: 0.75rem 0.9rem;
            border: 1px solid #d7dce7;
            border-radius: 12px;
            font-family: var(--lw-font);
            font-size: 1rem;
            background: #ffffff;
            color: #172033;
            transition: border-color 120ms ease, box-shadow 120ms ease;
        }
        .lw-login__input:focus {
            border-color: #818cf8;
            outline: none;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }
        .lw-login__btn {
            width: 100%;
            min-height: 52px;
            margin-top: 0.35rem;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 12px;
            color: #ffffff;
            background: var(--lw-login-primary);
            box-shadow: 0 10px 24px rgba(79, 70, 229, 0.25);
            font-size: 1rem;
            font-weight: 750;
            cursor: pointer;
            transition: background 120ms ease, transform 120ms ease, box-shadow 120ms ease;
        }
        .lw-login__btn:hover:not(:disabled) {
            background: var(--lw-login-primary-dark);
            box-shadow: 0 14px 28px rgba(79, 70, 229, 0.3);
            transform: translateY(-1px);
        }
        .lw-login__btn:focus-visible {
            outline: 3px solid rgba(99, 102, 241, 0.32);
            outline-offset: 3px;
        }
        .lw-login__btn:disabled {
            cursor: wait;
            opacity: 0.7;
        }
        .lw-login__error {
            display: none;
            margin-bottom: 1.15rem;
            padding: 0.75rem 0.9rem;
            background: rgba(179, 38, 30, 0.08);
            border: 1px solid var(--lw-colour-danger);
            border-radius: 12px;
            color: var(--lw-colour-danger);
            font-size: 0.9rem;
        }
        .lw-login__account-note {
            margin: 1.5rem 0 0;
            color: #98a2b3;
            font-size: 0.82rem;
            text-align: center;
        }
        @media (max-width: 760px) {
            .lw-login__shell {
                max-width: 500px;
                grid-template-columns: 1fr;
            }
            .lw-login__brand-panel {
                min-height: 185px;
                padding: 1.5rem;
            }
            .lw-login__brand-copy {
                margin: 2rem 0 0;
            }
            .lw-login__brand-copy h2 {
                margin-bottom: 0;
                font-size: 2rem;
            }
            .lw-login__brand-copy p,
            .lw-login__promise {
                display: none;
            }
            .lw-login__form-panel {
                padding: 2.25rem 1.5rem 2.5rem;
            }
        }
        @media (max-width: 420px) {
            .lw-login {
                padding: 0;
                background: #ffffff;
            }
            .lw-login__shell {
                min-height: 100vh;
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

<main class="lw-login">
    <section class="lw-login__shell" aria-labelledby="login-title">
        <div class="lw-login__brand-panel">
            <a class="lw-login__brand" href="/" aria-label="LanguageWise home">
                <img class="lw-login__logo" src="/assets/languagewise-icon.png" alt="">
                <span>LanguageWise</span>
            </a>

            <div class="lw-login__brand-copy">
                <h2>Learn a language.<br><span>Open your world.</span></h2>
                <p>Courses, practice, community, and progress tracking in one place.</p>
            </div>

            <p class="lw-login__promise">Learn &middot; Practice &middot; Grow</p>
        </div>

        <div class="lw-login__form-panel">
            <p class="lw-login__eyebrow">Welcome back</p>
            <h1 class="lw-login__title" id="login-title">Continue your journey</h1>
            <p class="lw-login__subtitle">Sign in to pick up where you left off.</p>

            <div class="lw-login__error" id="login-error" role="alert"></div>

            <form class="lw-login__form" id="login-form">
                <div class="lw-login__field">
                    <label class="lw-login__label" for="username">Username</label>
                    <input class="lw-login__input" id="username" name="username" type="text" autocomplete="username" required autofocus>
                </div>
                <div class="lw-login__field">
                    <label class="lw-login__label" for="password">Password</label>
                    <input class="lw-login__input" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="lw-login__btn" id="login-submit" type="submit">Sign in</button>
            </form>

            <p class="lw-login__account-note">One account for every LanguageWise experience.</p>
        </div>
    </section>
</main>

<script>
    function safeReturnUrl() {
        const requested = new URLSearchParams(window.location.search).get('returnUrl');
        const fallback = document.referrer ? new URL(document.referrer) : null;
        const candidate = requested || (
            fallback && fallback.origin === window.location.origin
                ? fallback.pathname + fallback.search + fallback.hash
                : '/index.html'
        );

        const resolved = new URL(candidate, window.location.origin);
        return resolved.origin === window.location.origin
            ? resolved.pathname + resolved.search + resolved.hash
            : '/index.html';
    }

    const returnUrl = safeReturnUrl();

    document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const errorEl = document.getElementById('login-error');
        const submitButton = document.getElementById('login-submit');
        errorEl.style.display = 'none';
        submitButton.disabled = true;
        submitButton.textContent = 'Signing in\u2026';

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                window.location.href = returnUrl;
            } else {
                errorEl.textContent = 'Invalid username or password. Please try again.';
                errorEl.style.display = 'block';
                submitButton.disabled = false;
                submitButton.textContent = 'Sign in';
            }
        } catch {
            errorEl.textContent = 'Unable to reach the server. Please try again later.';
            errorEl.style.display = 'block';
            submitButton.disabled = false;
            submitButton.textContent = 'Sign in';
        }
    });
</script>

</body>
</html>
